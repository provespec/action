name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.mjs

  # Dogfood: run this action on this repository, against the example grades.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: parity
        uses: ./
        with:
          spec: todomvc
          scope: AI
          grades: example/grades.json
          min: 80
          badge: badges/parity.svg
      - name: Report
        run: |
          echo "parity=${{ steps.parity.outputs.parity }}%"
          test -s badges/parity.svg && echo "badge written"
